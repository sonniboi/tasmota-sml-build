name: Build Tasmota SML (1MB)

on:
  workflow_dispatch:
    inputs:
      tasmota_tag:
        description: 'Tasmota release tag (e.g. v16.0.0)'
        required: true
        default: 'v16.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # noetig fuer softprops/action-gh-release (Default ist read-only)
    steps:
      - name: Checkout Tasmota
        uses: actions/checkout@v7
        with:
          repository: arendst/Tasmota
          ref: ${{ github.event.inputs.tasmota_tag }}
          fetch-depth: 1

      - name: Inject user_config_override.h
        uses: actions/checkout@v7
        with:
          path: _this
          fetch-depth: 1

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ github.event.inputs.tasmota_tag }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build tasmota-minimal (ohne Override, fuer den 2-Stufen-OTA auf 1MB)
        run: pio run -e tasmota-minimal

      - name: Copy override
        run: cp _this/user_config_override.h tasmota/user_config_override.h

      - name: Build tasmota (1MB, SML)
        run: pio run -e tasmota

      - name: Rename binary
        run: |
          cp build_output/firmware/tasmota.bin.gz tasmota-sml.bin.gz
          cp build_output/firmware/tasmota.bin tasmota-sml.bin
          cp build_output/firmware/tasmota-minimal.bin.gz tasmota-minimal.bin.gz
          ls -l tasmota-sml.bin.gz tasmota-minimal.bin.gz

      - name: Upload artifacts (Netz, falls der Release-Schritt scheitert)
        uses: actions/upload-artifact@v7
        with:
          name: tasmota-sml-${{ github.event.inputs.tasmota_tag }}
          path: |
            tasmota-sml.bin.gz
            tasmota-sml.bin
            tasmota-minimal.bin.gz
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tasmota_tag }}
          name: "Tasmota ${{ github.event.inputs.tasmota_tag }} SML"
          body: |
            Tasmota firmware build with **SML support** for **1 MB ESP8266** devices (Hichi IR reader, Sonoff Basic, ESP-01).

            Based on [Tasmota ${{ github.event.inputs.tasmota_tag }}](https://github.com/arendst/Tasmota/releases/tag/${{ github.event.inputs.tasmota_tag }}) with `USE_SCRIPT` + `USE_SML_M` enabled.

            ## Assets

            | File | Purpose |
            |---|---|
            | `tasmota-sml.bin.gz` | the firmware — SML + scripting |
            | `tasmota-minimal.bin.gz` | **required** intermediate step for the OTA, see below |
            | `tasmota-sml.bin` | uncompressed, for serial flashing |

            ## OTA update — two stages, and not straight from GitHub

            On a 1 MB device the full image does not fit next to the running one. Tasmota handles
            that by itself: it pulls `tasmota-minimal.bin.gz` **from the same directory**, flashes
            it, reboots, then fetches the full image. Both files have to be served side by side.

            > ⚠ **Downloading directly from GitHub does not work.** The ESP8266 has ~18 kB of free
            > heap, not enough for the TLS handshake — the transfer dies with
            > `Failed HTTP error: connection lost`. Serve both files over plain **HTTP from your
            > own LAN** instead.

            ```bash
            mkdir otasrv && cd otasrv
            V=${{ github.event.inputs.tasmota_tag }}
            curl -sL -O https://github.com/${{ github.repository }}/releases/download/$V/tasmota-sml.bin.gz
            curl -sL -O https://github.com/${{ github.repository }}/releases/download/$V/tasmota-minimal.bin.gz
            python3 -m http.server 9876 --bind 0.0.0.0
            ```

            ```
            OtaUrl http://<server-ip>:9876/tasmota-sml.bin.gz
            Upgrade 1
            ```

            A file upload through the web UI fails with "Not enough space" — the device has to
            fetch the firmware itself.

            Takes ~90 s and two reboots; **no meter readings in between**. Settings and your SML
            script are kept.

            See the [README](https://github.com/${{ github.repository }}#readme) for verification
            steps and the SML vs. OBIS-ASCII script templates.
          files: |
            tasmota-sml.bin.gz
            tasmota-sml.bin
            tasmota-minimal.bin.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
